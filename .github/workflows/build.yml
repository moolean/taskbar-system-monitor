name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and test (same entry point as local development)
        shell: powershell
        run: .\test.ps1

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: TaskbarSystemMonitor-win
          path: dist/TaskbarSystemMonitor.exe
